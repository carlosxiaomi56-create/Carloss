<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Porfa salagmos nya</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff4f0;
      font-family: Georgia, serif;
      color: #3d2925;
    }

    .date-form {
      width: min(90%, 420px);
      padding: 32px;
      background: white;
      border: 1px solid #e8c9c0;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(89, 48, 38, 0.12);
    }

    h1 {
      margin-top: 0;
      color: #a64b43;
      text-align: center;
    }

    p {
      text-align: center;
      color: #765a53;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d9aaa0;
      border-radius: 6px;
      font: inherit;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      margin-top: 24px;
      background: #a64b43;
      color: white;
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #823a35;
    }
  </style>
</head>

<body>

  <main class="date-form">

    <h1>Vamos a Salir mi catgirl uwu ♥</h1>

    <p>Amor elige el dia porfaa</p>

    <form
      action="https://formspree.io/f/xrpgwgon"
      method="POST"
    >

      <label for="date">Que dia tu mami te deja?</label>
      <input
        type="date"
        id="date"
        name="date"
        required
      >

      <label for="time">a que horita?</label>
      <input
        type="time"
        id="time"
        name="time"
        required
      >

      <label for="food">Comidita favorita</label>
      <input
        type="text"
        id="food"
        name="food"
        placeholder="Pizza, sushi, pasta, hamburguesa, pollo, etc..."
        required
      >

      <label for="message">
        Algo que me quieras decir o informar 👀??
      </label>

      <textarea
        id="message"
        name="message"
        placeholder="Escribe pues q miras..."
      ></textarea>

      <button type="submit">Enviaaaaa</button>

    </form>

  </main>

</body>
</html>
